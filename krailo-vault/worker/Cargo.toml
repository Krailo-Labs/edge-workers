[package]
name = "krailo-vault-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.5"
cfg-if = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = { version = "0.4", features = ["js"] }
console_error_panic_hook = "0.1.7"