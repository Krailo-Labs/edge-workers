[package]
name = "kvault"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "blocking"] }
clap = { version = "4.4", features = ["derive"] }
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.10"